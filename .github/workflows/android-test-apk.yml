# Builds the Android test app (APK) on GitHub's machines and puts it on a fixed
# download link: https://github.com/johnsamire-coder/bareeq/releases/latest/download/bareeq-test.apk
# The app reads the server address from deploy/server-url.txt when it opens.
name: Android test app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android-test-apk.yml"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
      - name: Build
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release --dart-define=API_BASE=remote
          cp build/app/outputs/flutter-apk/app-release.apk ../bareeq-test.apk
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: "بريق: نسخة تجربة ${{ github.run_number }}"
          body: "نسخة تجربة للموبايل (أندرويد). نزّل bareeq-test.apk وسطّبه."
          files: bareeq-test.apk
          make_latest: true
